[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ilt-flowdps"
version = "0.1.0"
description = "SOCS/Proxy ILT regularization and experimental rectified-flow posterior samplers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy", "scipy", "matplotlib", "pillow", "tqdm",
    "hopkins", "ilt", "hopkins_surrogate"]

[project.scripts]
ilt-flowdps-benchmark = "ilt_flowdps.benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ilt_flowdps*"]
