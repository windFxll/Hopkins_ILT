[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ilt"
version = "0.1.0"
description = "Pixel-based inverse lithography (ILT) optimization using the Hopkins imaging package"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pillow>=9",
  "tqdm>=4.66",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
include = ["ilt*"]

