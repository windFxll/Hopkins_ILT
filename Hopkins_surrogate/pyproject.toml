[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hopkins_surrogate"
version = "0.1.0"
description = "Lightweight frequency-domain SOCS kernel correction on top of Hopkins"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pillow>=9",
  "tqdm>=4.66",
  "torch>=2.1",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["hopkins_surrogate*"]
